[project]
name = "migracion-fast-api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "fastapi>=0.162.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "sqlalchemy[asyncio]>=2.1.6",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "import-linter>=2.15",
    "lefthook>=2.2.2",
    "mypy>=2.4.0",
    "openapi-core>=0.23.1",
    "pip-audit>=2.10.1",
    "poethepoet>=0.49.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D", "COM812", "CPY", "N818"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel", "pydantic_settings.BaseSettings", "app.shared.api_model.ApiModel"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.pylint]
max-args = 5
max-statements = 25
max-branches = 8

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["INP001"]
"src/app/**/adapters/http/*.py" = ["TC001", "TC003"]
"src/app/incidencias/adapters/persistence/*.py" = ["S608"]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "INP001", "TC001", "TC002", "TC003", "E501"]

[tool.mypy]
strict = true
python_version = "3.14"
mypy_path = "src:."
files = ["src", "tests"]
explicit_package_bases = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
markers = ["integration: pruebas contra una base PostgreSQL real"]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["src/app/main.py", "src/app/__main__.py", "src/app/clasificador_externo.py","src/app/**/ports.py", "src/app/**/adapters/persistence/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 98

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "El dominio no depende de frameworks ni de drivers"
type = "forbidden"
source_modules = ["app.catalogos.domain", "app.acceso.domain", "app.usuarios.domain", "app.incidencias.domain", "app.filtro_corrupcion.domain", "app.archivador.domain"]
forbidden_modules = ["fastapi", "starlette", "pydantic", "sqlalchemy", "psycopg", "structlog"]

[[tool.importlinter.contracts]]
name = "Las capas apuntan hacia adentro en catalogos"
type = "layers"
layers = ["app.catalogos.adapters", "app.catalogos.application", "app.catalogos.domain"]

[[tool.importlinter.contracts]]
name = "Las capas apuntan hacia adentro en acceso"
type = "layers"
layers = ["app.acceso.adapters", "app.acceso.application", "app.acceso.domain"]

[[tool.importlinter.contracts]]
name = "Las capas apuntan hacia adentro en usuarios"
type = "layers"
layers = ["app.usuarios.adapters", "app.usuarios.application", "app.usuarios.domain"]

[[tool.importlinter.contracts]]
name = "Las capas apuntan hacia adentro en incidencias"
type = "layers"
layers = ["app.incidencias.adapters", "app.incidencias.application", "app.incidencias.domain"]

[[tool.importlinter.contracts]]
name = "Las capas apuntan hacia adentro en filtro_corrupcion"
type = "layers"
layers = ["app.filtro_corrupcion.adapters", "app.filtro_corrupcion.application", "app.filtro_corrupcion.domain"]

[[tool.importlinter.contracts]]
name = "Las capas apuntan hacia adentro en archivador"
type = "layers"
layers = ["app.archivador.adapters", "app.archivador.application", "app.archivador.domain"]

[[tool.importlinter.contracts]]
name = "Los contextos son independientes entre sí"
type = "independence"
modules = ["app.catalogos", "app.acceso", "app.usuarios", "app.incidencias", "app.filtro_corrupcion", "app.archivador"]

[[tool.importlinter.contracts]]
name = "La aplicación no depende de frameworks ni de drivers"
type = "forbidden"
source_modules = ["app.catalogos.application", "app.acceso.application", "app.usuarios.application", "app.incidencias.application", "app.filtro_corrupcion.application", "app.archivador.application"]
forbidden_modules = ["fastapi", "starlette", "pydantic", "sqlalchemy", "psycopg", "structlog"]

[[tool.importlinter.contracts]]
name = "El kernel compartido no importa contextos ni salud ni configuración"
type = "forbidden"
source_modules = ["app.shared"]
forbidden_modules = ["app.catalogos", "app.acceso", "app.usuarios", "app.incidencias", "app.filtro_corrupcion", "app.archivador", "app.health", "app.config"]

[[tool.importlinter.contracts]]
name = "Las carpetas puras no dependen de capas ni de frameworks"
type = "forbidden"
source_modules = ["app.constants", "app.enums", "app.errors"]
forbidden_modules = ["app.shared", "app.catalogos", "app.acceso", "app.usuarios", "app.incidencias", "app.filtro_corrupcion", "app.archivador", "app.health", "app.config", "app.composition", "fastapi", "starlette", "pydantic", "sqlalchemy", "psycopg", "structlog"]

[[tool.importlinter.contracts]]
name = "La salud no importa contextos"
type = "forbidden"
source_modules = ["app.health"]
forbidden_modules = ["app.catalogos", "app.acceso", "app.usuarios", "app.incidencias", "app.filtro_corrupcion", "app.archivador"]

[tool.poe.tasks]
typecheck = "mypy"
lint = "ruff check ."
layers = "lint-imports"
format = "ruff format ."
format-check = "ruff format --check ."
test = "pytest -m 'not integration'"
test-coverage = "pytest -m 'not integration' --cov --cov-report=term-missing --cov-report=html --cov-report=xml --junitxml=reports/unitarias.xml"
test-integration = "pytest -m integration"
build = "uv build --wheel"
audit = "pip-audit"
hooks = "lefthook install"
plantilla = "python scripts/preparar_plantilla.py"
verificar = ["typecheck", "lint", "layers", "format-check", "test-coverage", "build", "audit"]
