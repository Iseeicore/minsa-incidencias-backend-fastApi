default:
  image: python:3.14.7-slim-bookworm
  interruptible: true
  before_script:
    - pip install --no-cache-dir uv==0.13.5
    - uv sync --locked

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"'
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'

stages:
  - verificar
  - integracion

verificar:
  stage: verificar
  timeout: 15m
  script:
    - unset TEST_DATABASE_URL
    - uv run poe verificar
  coverage: '/^TOTAL.*\s(\d+(?:\.\d+)?)%$/'
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - coverage.xml
      - reports/
    reports:
      junit: reports/unitarias.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

integracion:
  stage: integracion
  timeout: 15m
  script:
    - uv run poe test-integration
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $TEST_DATABASE_URL'
      when: manual
      allow_failure: false
