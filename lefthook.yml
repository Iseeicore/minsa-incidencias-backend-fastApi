pre-commit:
  piped: true
  commands:
    format:
      priority: 1
      glob: "*.py"
      run: uv run ruff format --check {staged_files}
    lint:
      priority: 2
      glob: "*.py"
      run: uv run ruff check {staged_files}
    typecheck:
      priority: 3
      glob: "*.py"
      run: uv run mypy
    tests:
      priority: 4
      glob: "*.py"
      run: uv run poe test

pre-push:
  piped: true
  commands:
    integracion:
      priority: 1
      run: uv run poe test-integration
    verificar:
      priority: 2
      run: uv run poe verificar
